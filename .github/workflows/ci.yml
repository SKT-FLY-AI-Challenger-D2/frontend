name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gradle Wrapper 검증 (커밋된 gradle-wrapper.jar 무결성)
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: 단위 테스트 (JDK21 / SDK36)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK 빌드
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew --no-daemon assembleDebug -PBACKEND_BASE_URL=http://104.41.141.254:8000

      - name: APK artifact 업로드 (commit SHA로 식별)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
